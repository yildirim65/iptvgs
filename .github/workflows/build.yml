name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Proje zipini ac
        run: unzip -o project.zip -d proje

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: APK olustur
        run: cd proje && gradle assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: proje/app/build/outputs/apk/debug/app-debug.apk
