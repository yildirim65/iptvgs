name: APK Derle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Proje zipini ac
        run: |
          ZIPDOSYA=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Ana zip: $ZIPDOSYA"
          unzip -o "$ZIPDOSYA" -d proje

          # Ic ice zip varsa onlari da ac (3 seviyeye kadar)
          for i in 1 2 3; do
            ICZIP=$(find proje -name "*.zip" | head -n 1)
            if [ -n "$ICZIP" ]; then
              echo "Icteki zip aciliyor: $ICZIP"
              unzip -o "$ICZIP" -d proje
              rm -f "$ICZIP"
            fi
          done

          echo "--- Acilan dosyalar ---"
          find proje -maxdepth 3

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: APK olustur
        run: |
          AYAR=$(find proje -name "settings.gradle.kts" | head -n 1)
          if [ -z "$AYAR" ]; then
            echo "HATA: settings.gradle.kts hala bulunamadi! Icerik:"
            find proje
            exit 1
          fi
          KLASOR=$(dirname "$AYAR")
          echo "Proje klasoru: $KLASOR"
          cd "$KLASOR"
          gradle assembleDebug

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: "**/app-debug.apk"
